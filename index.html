 function valid(data){if(!data||data.schemaVersion!==1)fail('対応していないスキーマです');if(typeof data.applicationVersion!=='string')fail('バージョンがありません');date(data.exportedAt);if(!Array.isArray(data.positions)||!Array.isArray(data.settlements)||!data.settings)fail('必須データがありません');const settings=data.settings;if(settings.numberFont!==undefined&&!Object.hasOwn(NUMBER_FONTS,settings.numberFont))fail('フォント設定が不正です');if(!Array.isArray(settings.currencyPairs)||!settings.currencyPairs.length||settings.currencyPairs.some(x=>typeof x!=='string'||!x.trim()||x.length>30)||new Set(settings.currencyPairs).size!==settings.currencyPairs.length)fail('通貨ペア設定が不正です');for(const k of ['lastBackupAt','lastDataChangeAt']){if(settings[k]!==null)date(settings[k])}if(typeof settings.applicationVersion!=='string')fail('設定バージョンがありません');const ids=new Set(),positions=new Map();for(const [rows,kind]of [[data.positions,'p'],[data.settlements,'s']])for(const x of rows){if(!x||typeof x.id!=='string'||!x.id||x.id.length>100||ids.has(x.id))fail('IDが不正または重複しています');ids.add(x.id);for(const k of ['executedAt','createdAt','updatedAt'])date(x[k]);for(const k of ['quantity','executionPrice'])if(decimal(x[k])<=0n)fail('数量・価格は正数が必要です');if(kind==='p'){if(!settings.currencyPairs.includes(x.currencyPair)||!['buy','sell'].includes(x.side))fail('通貨ペア・売買区分が不正です');positions.set(x.id,x)}else{for(const k of ['pipsProfit','positionProfit','swapProfit'])decimal(x[k]);const p=positions.get(x.positionId);if(!p)fail('紐付く新規約定がありません');if(Date.parse(x.executedAt)<Date.parse(p.executedAt))fail('決済日時は新規約定以降にしてください')}}for(const p of data.positions){if(decimal(sum(data.settlements.filter(x=>x.positionId===p.id),x=>x.quantity))>decimal(p.quantity))fail('決済数量が新規数量を超えています')}return data}

const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fmt=v=>{const s=String(v),[a,b]=s.split('.');return a.replace(/\B(?=(\d{3})+(?!\d))/g,',')+(b?'.'+b:'')}, signed=v=>(Core.decimal(v)>0n?'+':'')+fmt(v), cls=v=>Core.decimal(v)>0n?'positive':Core.decimal(v)<0n?'negative':'';

// All calendar arithmetic uses UTC getters on an explicitly shifted JST clock.
// These functions derive dates only; stored execution timestamps are never changed.
function utcDate(year,month,day,hour=0){
 const date=new Date(0);date.setUTCFullYear(year,month,day);date.setUTCHours(hour,0,0,0);return date;
}
function isUsDaylightTime(executedAt){

 const year=new Date(Date.parse(executedAt)+9*3600000).getUTCFullYear();

function tradingClock(executedAt){
 Core.date(executedAt);

let db,data,tab='calendar',month=initialCalendarDay().slice(0,7),pair='',day=initialCalendarDay(),period='month',analysisMonth=month,analysisYear=month.slice(0,4),analysisPair='',expanded=new Set(),highlight='';
function defaults(){return{numberFont:'system',currencyPairs:['USD/JPY','EUR/JPY','GBP/JPY','AUD/JPY','EUR/USD'],lastBackupAt:null,lastDataChangeAt:null,applicationVersion:VERSION}}

function summary(xs,full=false){const s=Core.stats(xs),items=[['建玉損益',s.position,'円'],['累計スワップ損益',s.swap,'円'],['決済損益',s.total,'円'],['pips損益',s.pips,'pips']];if(full)items.push(['決済件数',String(s.count),'件',false],['勝率',s.win,'%',false],['平均利益',s.avgWin,'円'],['平均損失',s.avgLoss,'円']);return'<div class="stats">'+items.map(([k,v,u,isProfit=true])=>`<div class="stat"><span>${k}</span><strong class="${isProfit?cls(v):''}">${fmt(v)} <small>${u}</small></strong></div>`).join('')+'</div>'}
function selectedFontFamily(key=data.settings.numberFont||'system'){
 return (NUMBER_FONTS[key]||NUMBER_FONTS.system).family+', "Hiragino Kaku Gothic ProN", "Hiragino Sans", -apple-system, sans-serif';
}

function render(){const tabs=[['calendar','▦','カレンダー'],['history','☷','約定履歴'],['analysis','▥','損益分析'],['settings','⚙','設定']];$('nav').innerHTML=tabs.map(([id,icon,name])=>`<button data-tab="${id}" class="${tab===id?'active':''}" aria-current="${tab===id?'page':'false'}"><span class="nav-icon" aria-hidden="true">${icon}</span>${name}</button>`).join('');$('#app').classList.toggle('calendar-view',tab==='calendar');$('#app').innerHTML=({calendar:calendar,history:history,analysis:analysis,settings:settings}[tab])();applyNumberFont($('#app'))}
function calendar(){
 const xs=tradingSettlements(filtered(),month),stats=Core.stats(xs),[year,m]=month.split('-').map(Number);
 const today=getTradingDate(now()),dates=calendarDates(month);
 const cells=dates.map(d=>{
  if(!d)return '<div class="day empty" aria-hidden="true"></div>';
  const rows=xs.filter(s=>getTradingDate(s.executedAt)===d),profit=Core.sum(rows,Core.total);
  return `<button class="day ${d===day?'selected':''} ${d===today?'today':''}" data-day="${d}" aria-label="${d} FX取引日${rows.length?' 決済損益 '+signed(profit)+'円':''}"><span>${Number(d.slice(-2))}</span>${rows.length?`<span class="money ${cls(profit)}">${signed(profit)}</span>`:''}</button>`;
 }).join('');

 return `<div class="eyebrow">YOUR TRADING, AT A GLANCE</div><h1>損益カレンダー</h1><div class="muted">FX取引日で、日々の記録を振り返る。</div>
 <div class="hero"><div class="row between"><span class="muted">${year}年${m}月の決済損益</span><span class="tag">${stats.count} 件の決済</span></div><div class="amount ${cls(stats.total)}">${signed(stats.total)} <span style="font-size:16px">円</span></div><span class="muted">FX取引日基準 · 休場時間の決済は別枠表示</span></div>
 <div class="row between toolbar"><div class="row"><button data-month="-1" aria-label="前月">‹</button><strong>${year}年 ${m}月</strong><button data-month="1" aria-label="翌月">›</button></div><select id="calendar-pair" aria-label="通貨ペア">${options(pair)}</select></div>
 <section class="card"><div class="calendar">${['月','火','水','木','金'].map(d=>`<div class="weekday">${d}</div>`).join('')}${cells}</div><p class="muted">翌朝の決済は前取引日に計上します。標準時間は06:50、夏時間は05:50まで（日本時間）。</p></section>
 <section class="card selected-settlements"><div class="row between"><h2>${esc(day.slice(5).replace('-','月'))}日の決済</h2><span class="muted">${selected.length}件</span></div><p class="muted">FX取引日 ${day} / 明細は実際の約定日時</p>${selected.length?settlementList(selected):'<div class="empty-state">この取引日の決済はありません。<br>約定履歴から取引を記録しましょう。</div>'}</section>

function history(){return`<div class="row between"><div><div class="eyebrow">TRADE JOURNAL</div><h1>約定履歴</h1></div><button class="primary" data-new>＋ 新規約定</button></div><p class="muted">新規約定ごとに、決済までの記録をまとめて。</p>${data.positions.length?data.positions.slice().sort((a,b)=>b.executedAt.localeCompare(a.executedAt)).map(p=>{const ss=children(p),closed=Core.sum(ss,x=>x.quantity),remaining=Core.str(Core.decimal(p.quantity)-Core.decimal(closed)),total=Core.sum(ss,Core.total);return`<article class="card trade" id="p-${esc(p.id)}"><button class="trade-head" data-expand="${esc(p.id)}" aria-expanded="${expanded.has(p.id)}"><div class="row between"><div class="row"><span class="tag ${p.side==='buy'?'positive':'negative'}">${p.side==='buy'?'買い':'売り'}</span><strong>${esc(p.currencyPair)}</strong></div><span class="tag">${Core.decimal(remaining)===0n?'全決済':ss.length?'一部決済':'未決済'}</span></div><div class="row between"><b>${fmt(p.quantity)} Lot <span class="muted">@ ${fmt(p.executionPrice)}</span></b><span>${expanded.has(p.id)?'⌃':'⌄'}</span></div><div class="row between"><span class="muted">${dt(p.executedAt)} JST</span>${money(total)}</div><div class="row between muted"><span>決済済 ${fmt(closed)} Lot</span><span>未決済 ${fmt(remaining)} Lot</span></div></button>${expanded.has(p.id)?`<div class="actions row"><button class="primary" data-settle="${esc(p.id)}" ${Core.decimal(remaining)===0n?'disabled':''}>＋ 決済を追加</button><button data-edit-p="${esc(p.id)}">新規約定を編集</button><button class="danger" data-delete-p="${esc(p.id)}">削除</button></div><div class="children">${ss.length?ss.map(s=>`<section class="child ${highlight===s.id?'highlight':''}" id="s-${esc(s.id)}"><div class="row between"><b>${p.side==='buy'?'売り':'買い'} ${fmt(s.quantity)} Lot</b>${money(Core.total(s))}</div><div class="muted" style="margin-top:8px">${dt(s.executedAt)} JST</div><dl class="detail"><dt>決済価格</dt><dd>${fmt(s.executionPrice)}</dd><dt>pips損益</dt><dd class="${cls(s.pipsProfit)}">${signed(s.pipsProfit)}</dd><dt>建玉損益</dt><dd>${money(s.positionProfit)}</dd><dt>累計スワップ</dt><dd>${money(s.swapProfit)}</dd></dl><div class="row actions"><button data-edit-s="${esc(s.id)}">編集</button><button data-delete-s="${esc(s.id)}" class="danger">削除</button></div></section>`).join(''):'<p class="empty-state">決済はまだ登録されていません。</p>'}</div>`:''}</article>`}).join(''):'<section class="card empty-state"><div style="font-size:38px;color:#8ca895">＋</div><h2>最初の取引を記録しましょう</h2><p>新規約定を追加すると、部分決済と<br>確定損益をまとめて管理できます。</p><button class="primary" data-new>新規約定を追加</button></section>'}`}
function graph(title,xs,key,cumulative=false){const groups=new Map();for(const s of xs){const k=key(s);groups.set(k,(groups.get(k)||0n)+Core.decimal(Core.total(s)))}let acc=0n;const rows=[...groups].sort(([a],[b])=>a.localeCompare(b)).map(([k,v])=>[k,Core.str(cumulative?(acc+=v):v)]);if(!rows.length)return`<section class="card"><h2>${title}</h2><div class="empty-state">決済データがありません</div></section>`;const vals=rows.map(x=>Number(x[1])),max=Math.max(...vals.map(Math.abs),1),w=620,h=180,step=560/rows.length;let points='';const bars=rows.map(([k,v],i)=>{const x=40+i*step+step/2,y=90-Number(v)/max*65;points+=`${x},${y} `;return`<rect x="${x-Math.max(1,step*.3)}" y="${Math.min(y,90)}" width="${Math.max(1,step*.6)}" height="${Math.max(Math.abs(90-y),1)}" rx="2" fill="${Number(v)<0?'#72cba5':Number(v)>0?'#ff8888':'#a4b8ac'}"><title>${esc(k)}: ${signed(v)}円</title></rect>`}).join('');return`<section class="card"><h2>${title}</h2><svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${title}"><line x1="30" y1="90" x2="610" y2="90" stroke="#43574c"/><text x="3" y="94">0</text>${cumulative?`<polyline points="${points}" fill="none" stroke="#a4b8ac" stroke-width="3"/>`:bars}<text x="40" y="176">${esc(rows[0][0])}</text><text x="600" y="176" text-anchor="end">${esc(rows.at(-1)[0])}</text></svg><details><summary class="muted">数値を見る（${rows.length}件）</summary><div class="chart-list">${rows.map(([k,v])=>`<div class="row between"><span>${esc(k)}</span>${money(v)}</div>`).join('')}</div></details></section>`}
function analysis(){const xs=tradingSettlements(filtered(analysisPair),period==='all'?'':period==='month'?analysisMonth:analysisYear);return`<div class="eyebrow">PERFORMANCE</div><h1>損益分析</h1><p class="muted">FX取引日で集計。休場時間の決済は下の別枠で確認できます。</p><div class="row toolbar"><select id="period" aria-label="集計期間">${[['month','月別'],['year','年別'],['all','全期間']].map(([v,l])=>`<option value="${v}" ${period===v?'selected':''}>${l}</option>`).join('')}</select>${period==='month'?`<input type="month" id="analysis-month" value="${analysisMonth}" aria-label="対象月">`:period==='year'?`<input type="number" min="1" max="9999" id="analysis-year" value="${analysisYear}" aria-label="対象年" style="width:110px">`:''}<select id="analysis-pair" aria-label="分析通貨ペア">${options(analysisPair)}</select></div><section class="card">${summary(xs,true)}<p class="muted">勝率はゼロ損益を含む全決済が分母です。pipsは数量加重せず合算します。</p></section>${graph('日別決済損益',xs,s=>getTradingDate(s.executedAt))}${graph('月別決済損益',xs,s=>getTradingDate(s.executedAt).slice(0,7))}${graph('累積決済損益',xs,s=>getTradingDate(s.executedAt),true)}${graph('通貨ペア別決済損益',xs,s=>data.positions.find(p=>p.id===s.positionId).currencyPair)}${exceptionsPanel(analysisPair)}`}
function settings(){const s=data.settings;return`<div class="eyebrow">PREFERENCES</div><h1>設定</h1><p class="muted">大切な記録を、手元で安全に。</p>${fontSettings()}<section class="card"><h2>通貨ペア</h2>${s.currencyPairs.map((p,i)=>`<div class="pair-row"><input aria-label="通貨ペア ${i+1}" value="${esc(p)}" id="pair-${i}" maxlength="30"><button data-pair-save="${i}">変更</button></div>`).join('')}<form id="pair-form" class="pair-row"><input name="pair" placeholder="例：NZD/JPY" aria-label="追加通貨ペア" maxlength="30" required><button type="submit">＋ 追加</button></form></section><section class="card"><h2>バックアップと復元</h2><p class="muted">${s.lastBackupAt?'最終エクスポート実行日時<br>'+dt(s.lastBackupAt)+' JST':'バックアップ未実施'}</p><p class="tag">${!s.lastBackupAt?'バックアップ未実施':s.lastDataChangeAt&&s.lastDataChangeAt>s.lastBackupAt?'未保存の変更あり':'エクスポート後の変更なし'}</p><p class="muted">ファイルへの保存完了は検出できません。書き出したファイルの保存先を必ず確認してください。</p><div class="row"><button class="primary" data-export>JSONエクスポート</button><button data-import>JSONインポート</button><button data-csv>CSVエクスポート</button></div><input type="file" id="import-file" accept=".json,application/json" hidden><p class="muted">CSVは閲覧・分析用です。完全な復元にはJSONを使います。</p></section><section class="card"><h2>このアプリについて</h2><p class="muted">バージョン ${VERSION} · 日本時間（JST）<br>Safariの共有メニューから「ホーム画面に追加」でアプリとして利用できます。初回読み込み後はオフラインでも記録できます。</p><button data-update-check>アプリの更新を確認</button><p class="notice">データはこの端末のIndexedDBに保存されます。端末故障やSafariのデータ削除で失われることがあります。定期的にJSONをバックアップしてください。</p><button class="danger" data-reset>全データ削除</button></section>`}
function field(label,name,value,type='text'){return`<label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" ${type==='text'?(name.endsWith('Profit')?'inputmode="text"':'inputmode="decimal"'):''} value="${esc(value)}" required ${type==='datetime-local'?'step="0.001"':''}>`}
function edit(kind,id,parentId){const isP=kind==='p',old=(isP?data.positions:data.settlements).find(x=>x.id===id),p=isP?old:data.positions.find(x=>x.id===(old?.positionId||parentId)),v=old||{};$('#editor').innerHTML=`<form id="trade-form"><div class="row between"><h2>${old?'編集':isP?'新規約定を追加':'決済を追加'}</h2><button type="button" data-close aria-label="閉じる">×</button></div>${!isP?`<p class="muted">${esc(p.currencyPair)} · ${p.side==='buy'?'売り決済':'買い決済'} · 残り ${Core.str(Core.decimal(p.quantity)-Core.decimal(Core.sum(children(p),s=>s.quantity)))} Lot</p>`:''}${isP?`<label>通貨ペア</label><select name="currencyPair">${options(v.currencyPair||data.settings.currencyPairs[0],false)}</select><label>売買区分</label><select name="side"><option value="buy">買い</option><option value="sell" ${v.side==='sell'?'selected':''}>売り</option></select>`:''}<div class="form-grid"><div>${field('数量（Lot）','quantity',v.quantity||'')}</div><div>${field('約定価格','executionPrice',v.executionPrice||'')}</div></div>${field('約定日時（日本時間）','executedAt',(v.executedAt||now()).replace('+09:00',''),'datetime-local')}${!isP?field('pips損益（手入力）','pipsProfit',v.pipsProfit||'0')+field('建玉損益（円・手入力）','positionProfit',v.positionProfit||'0')+field('累計スワップ損益（円・手入力）','swapProfit',v.swapProfit||'0')+'<div class="hero">決済損益 <strong id="live-total"></strong></div>':''}<p class="notice" id="trading-warning" role="status" hidden>通常のFX取引可能時間外です。保存時に確認します。決済は取引日集計に含めず、例外一覧で表示します。</p><p class="error" id="form-error" role="alert"></p><div class="row"><button class="primary" type="submit">保存する</button><button type="button" data-close>キャンセル</button></div></form>`;const f=$('#trade-form');const live=()=>{tradingWarning();if(!isP){try{$('#live-total').innerHTML=money(Core.str(Core.decimal(f.elements.positionProfit.value)+Core.decimal(f.elements.swapProfit.value)))}catch{$('#live-total').textContent='—'}}};f.oninput=live;live();f.onsubmit=async e=>{e.preventDefault();const submit=f.querySelector('[type=submit]');submit.disabled=true;try{const vals=Object.fromEntries(new FormData(f));vals.executedAt=vals.executedAt.length===16?vals.executedAt+':00+09:00':vals.executedAt+'+09:00';for(const k of ['quantity','executionPrice',...(!isP?['pipsProfit','positionProfit','swapProfit']:[])])vals[k]=Core.str(Core.decimal(vals[k]));const row={...vals,id:old?.id||uid(),createdAt:old?.createdAt||now(),updatedAt:now(),...(!isP?{positionId:p.id}:{})};const next=copy(),key=isP?'positions':'settlements';next[key]=old?next[key].map(x=>x.id===old.id?row:x):[...next[key],row];Core.valid(envelope(next));if(!isTradingTime(row.executedAt)&&!confirm('通常のFX取引可能時間外です。この日時のまま登録しますか？決済データは通常集計に含めず、例外一覧に表示します。'))return;await save(next);expanded.add(isP?row.id:p.id);$('#editor').close();render();toast('保存しました')}catch(err){$('#form-error').textContent=err.message}finally{submit.disabled=false}};applyNumberFont($('#editor'));$('#editor').showModal()}
async function remove(kind,id){const p=kind==='p';if(!confirm(p?'この新規約定と、紐付くすべての決済約定を削除しますか？':'この決済約定を削除しますか？'))return;const next=copy();if(p){next.positions=next.positions.filter(x=>x.id!==id);next.settlements=next.settlements.filter(x=>x.positionId!==id)}else next.settlements=next.settlements.filter(x=>x.id!==id);await save(next);render()}
function download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
async function exportJSON(){const next=copy();next.settings.lastBackupAt=new Date(Math.max(Date.now(),Date.parse(next.settings.lastDataChangeAt||'')||0)+32400000).toISOString().slice(0,19)+'+09:00';const backup=envelope(next);download(JSON.stringify(backup,null,2),'fx-backup-'+backup.exportedAt.slice(0,19).replace(/[-:]/g,'').replace('T','-')+'.json','application/json');await save(next,false);render();toast('エクスポートしました。ファイル保存をご確認ください')}
function csv(){const rows=[['新規約定ID','決済約定ID','通貨ペア','新規売買区分','新規数量','新規約定価格','新規約定日時','決済売買区分','決済数量','決済約定価格','決済約定日時','pips損益','建玉損益','累計スワップ損益','決済損益']];for(const s of data.settlements){const p=data.positions.find(p=>p.id===s.positionId);rows.push([p.id,s.id,p.currencyPair,p.side==='buy'?'買い':'売り',p.quantity,p.executionPrice,p.executedAt,p.side==='buy'?'売り':'買い',s.quantity,s.executionPrice,s.executedAt,s.pipsProfit,s.positionProfit,s.swapProfit,Core.total(s)])}download('\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/^[=+@\t\r]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\r\n'),'fx-settlements-'+now().slice(0,10)+'.csv','text/csv;charset=utf-8')}
async function importJSON(file){if(!file)return;if(file.size>20*1024*1024)throw new Error('JSONは20MB以内にしてください');const parsed=Core.valid(JSON.parse(await file.text()));const outsidePositions=parsed.positions.filter(p=>!isTradingTime(p.executedAt)).length,outsideSettlements=parsed.settlements.filter(s=>!isTradingTime(s.executedAt)).length;if(!confirm(`休場時間の新規約定 ${outsidePositions}件・決済 ${outsideSettlements}件があります。休場時間の決済は通常集計から分けて例外一覧に表示します。\n新規約定 ${parsed.positions.length}件、決済約定 ${parsed.settlements.length}件を復元します。現在のすべてのデータ・設定を置き換えます。よろしいですか？`))return;await save({positions:parsed.positions,settlements:parsed.settlements,settings:parsed.settings});pair=analysisPair='';expanded.clear();render();toast('復元しました')}
async function pairSave(i,value){value=value.trim().toUpperCase();if(!value||value.length>30)throw new Error('通貨ペアは1〜30文字で入力してください');const next=copy(),old=next.settings.currencyPairs[i];if(next.settings.currencyPairs.includes(value)&&old!==value)throw new Error('登録済みの通貨ペアです');if(i===undefined)next.settings.currencyPairs.push(value);else{next.settings.currencyPairs[i]=value;for(const p of next.positions)if(p.currencyPair===old){p.currencyPair=value;p.updatedAt=now()}}await save(next);if(pair===old)pair=value;if(analysisPair===old)analysisPair=value;render();toast('通貨ペアを保存しました')}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{const d=b.dataset;if(d.font){await setFont(d.font)}else if(d.tab){tab=d.tab;render();window.scrollTo(0,0)}else if(d.month){const[y,m]=month.split('-').map(Number),date=new Date(Date.UTC(y,m-1+Number(d.month),1));month=date.toISOString().slice(0,7);day=calendarDates(month).find(Boolean);render()}else if(d.day){day=d.day;render()}else if(d.jump){const s=data.settlements.find(s=>s.id===d.jump);expanded.add(s.positionId);highlight=s.id;tab='history';render();requestAnimationFrame(()=>document.getElementById('s-'+s.id)?.scrollIntoView({behavior:'smooth',block:'center'}))}else if(d.expand){expanded.has(d.expand)?expanded.delete(d.expand):expanded.add(d.expand);render()}else if('new'in d)edit('p');else if(d.settle)edit('s',null,d.settle);else if(d.editP)edit('p',d.editP);else if(d.editS)edit('s',d.editS);else if(d.deleteP)await remove('p',d.deleteP);else if(d.deleteS)await remove('s',d.deleteS);else if('close'in d)$('#editor').close();else if('export'in d)await exportJSON();else if('import'in d)$('#import-file').click();else if('csv'in d)csv();else if('pairSave'in d)await pairSave(Number(d.pairSave),$('#pair-'+d.pairSave).value);else if('reset'in d){if(confirm('全約定・通貨ペア設定・バックアップ履歴を削除します。元に戻せません。必要なJSONを保存しましたか？')){await save({positions:[],settlements:[],settings:defaults()});pair=analysisPair='';expanded.clear();render();toast('全データを削除しました')}}else if('updateCheck'in d){if(!registration)throw new Error('Service Workerはまだ利用できません');await registration.update();toast(registration.waiting?'更新を適用できます':'更新を確認しました')}else if('applyUpdate'in d){if($('#editor').open){toast('入力を保存またはキャンセルしてから更新してください');return}if(confirm('アプリを更新して再読み込みしますか？取引データは保持されます。')){reloadOnController=true;registration.waiting?.postMessage({type:'SKIP_WAITING'})}}}catch(err){toast(err.message)}});
document.addEventListener('change',async e=>{const t=e.target;try{if(t.id==='number-font'){t.disabled=true;try{await setFont(t.value)}finally{t.disabled=false;t.value=data.settings.numberFont||'system'}return}else if(t.id==='calendar-pair')pair=t.value;else if(t.id==='period')period=t.value;else if(t.id==='analysis-pair')analysisPair=t.value;else if(t.id==='analysis-month'){if(!t.value)return;analysisMonth=t.value}else if(t.id==='analysis-year'){if(!t.checkValidity()||!t.value)return;analysisYear=t.value.padStart(4,'0')}else if(t.id==='import-file'){await importJSON(t.files[0]);t.value='';return}else return;render()}catch(err){toast('読み込みできません: '+err.message);t.value=''}});
document.addEventListener('submit',async e=>{if(e.target.id==='pair-form'){e.preventDefault();try{await pairSave(undefined,new FormData(e.target).get('pair'))}catch(err){toast(err.message)}}});
let registration,reloadOnController=false;
async function start(){try{await openDB();render();if('serviceWorker'in navigator){try{registration=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});const notify=()=>{if(registration.waiting){$('#update').hidden=false;$('#update').innerHTML='新しいバージョンを利用できます。 <button data-apply-update>更新する</button>'}};notify();registration.addEventListener('updatefound',()=>{const w=registration.installing;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)notify()})});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloadOnController)location.reload()})}catch{toast('オフライン準備に失敗しました。オンラインで再読み込みしてください')}}}catch(err){$('#app').innerHTML='<h1>保存領域を開けません</h1><p>'+esc(err.message)+'</p><p>Safariのストレージ設定・空き容量を確認して再読み込みしてください。</p>'}}
if(!globalThis.__SONEKI_TEST__)start();
</script></body></html>
